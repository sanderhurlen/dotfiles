# fleet — linked to ~/.config/fleet/config.toml by fleet/install.sh. Read when fleet starts;
# a missing key keeps its default (the values below).

[autopilot]
enabled = true                              # --no-autopilot / A turn it off for a session
triggers = ["review", "build", "conflict", "triage"]  # new PR to review · my PR's build fails · my PR conflicts · new untriaged Issue/Bug
max_parallel = 2                            # fleet agents running at once, manual ones included
backlog_hours = 24                          # older events are skipped; weekend days don't count
max_fix_attempts = 2                        # per PR, then «🤖 ga opp»
hours = "07-17"                             # starts agents only then …
weekdays = "mon-fri"                        # … on these days (or "mon,wed,fri"); A → u allows outside

[notify]
start = true    # autopilot started an agent (or gave up)
done = true     # any fleet agent finished
blocked = true  # any fleet agent waits for me

[chores]  # bin/chores: repo maintenance under FLEET_ROOTS
# mise: repos that need no runtime pinned (docs, templates, Business Central, prototypes)
skip = ["brick1890-docs", "visense-docs", "pipeline-templates", "my-workday", "PROTOTYPE-visense-business",
        "visense-bc-enterprise", "visense-bc-ledger-api", "visense-azure-ad-b2c"]

[chores.baseline]  # mise: version every pin must match (prefix: "26" fits 26.4.0 and >=26)
node = "26"
pnpm = "11"
dotnet = "10"
python = "3.13"
